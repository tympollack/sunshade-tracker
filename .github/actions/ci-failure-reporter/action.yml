name: 'SunShade CI Failure Reporter'
description: 'Ingests build, lint, and test failures directly into SunShade Tracker as actionable bug items.'
inputs:
  tracker_token:
    description: 'Bearer token for SunShade Tracker API (repository secret SUNSHADE_TRACKER_TOKEN)'
    required: true
  tracker_url:
    description: 'Base URL for SunShade Tracker'
    required: false
    default: 'https://track.sunshade.icu'
  project_slug:
    description: 'Project slug in SunShade Tracker'
    required: false
    default: 'sunshade-tracker'
  commit_sha:
    description: 'Commit SHA that failed'
    required: false
    default: ${{ github.sha }}
  job_name:
    description: 'Name of the failing job'
    required: false
    default: ${{ github.job }}
  pr_number:
    description: 'Pull request number if applicable'
    required: false
    default: ${{ github.event.pull_request.number }}
  error_message:
    description: 'Concise summary of the error'
    required: false
    default: 'CI check failed'
  log_file:
    description: 'Optional path to log file containing stack trace'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Ingest Failure into SunShade Tracker
      shell: bash
      env:
        SUNSHADE_TRACKER_TOKEN: ${{ inputs.tracker_token }}
        TRACKER_URL: ${{ inputs.tracker_url }}
        PROJECT_SLUG: ${{ inputs.project_slug }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        JOB_NAME: ${{ inputs.job_name }}
        PR_NUMBER: ${{ inputs.pr_number }}
        ERROR_MESSAGE: ${{ inputs.error_message }}
        LOG_FILE: ${{ inputs.log_file }}
      run: |
        STACK_TRACE="No log file provided"
        if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
          STACK_TRACE=$(tail -n 40 "$LOG_FILE" | sed 's/"/\\"/g')
        fi
        
        SHORT_SHA="${COMMIT_SHA:0:8}"
        REF_ID="BUG-CI-${SHORT_SHA}-${JOB_NAME}"
        
        BODY=$(cat <<EOF
        {
          "project_slug": "$PROJECT_SLUG",
          "items": [
            {
              "external_ref_id": "$REF_ID",
              "item_type": "bug",
              "title": "CI Failure: $ERROR_MESSAGE in $JOB_NAME",
              "description": "### Automated CI Failure Report\n> **Job:** \`$JOB_NAME\`\n> **Commit:** \`$COMMIT_SHA\`\n\n\`\`\`\n$STACK_TRACE\n\`\`\`",
              "status": "not_started",
              "metadata": {
                "ci_job": "$JOB_NAME",
                "commit_hash": "$COMMIT_SHA",
                "pr_number": "${PR_NUMBER:-}",
                "priority": "Critical",
                "severity": "High",
                "auto_generated": true,
                "agent_prompt": "### SYSTEM ROLE & OBJECTIVE\nYou are an Autonomous CI Remediation Specialist. Fix failure in job $JOB_NAME on commit $COMMIT_SHA."
              }
            }
          ]
        }
        EOF
        )
        
        curl -s -X POST "${TRACKER_URL}/api/v1/items/ingest" \
          -H "Authorization: Bearer $SUNSHADE_TRACKER_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$BODY"
